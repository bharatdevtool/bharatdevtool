[build]
  command = "pnpm build"
  publish = "out"

# ── Cache headers ──────────────────────────────────────────────
# Next.js build output: file names change whenever content changes, so
# browsers can keep these for a year without ever serving stale code.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static HTML tools' shared CSS/JS/fonts: file names stay the same when
# edited, so cache briefly. Browsers reuse them across page-to-page
# navigation and pick up a deploy within an hour.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/components/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML pages, sitemap.xml and robots.txt keep Netlify's default
# (always revalidate) so every deploy is visible immediately.

# Retired Lottie tools → the unified player
[[redirects]]
  from = "/tools/lottie-analyzer"
  to = "/lottie-player"
  status = 301

[[redirects]]
  from = "/tools/lottie-editor"
  to = "/lottie-player"
  status = 301

