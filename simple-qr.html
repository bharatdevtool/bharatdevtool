  <!-- Scripts -->
  <script>
    // Theme management
    function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.classList.toggle('dark', saved === 'dark');
      } else {
        document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Toast notifications
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 100);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => container.removeChild(toast), 300);
      }, 3000);
    }

    // Fallback QR Code generation using qrcode-generator
    function generateQRCodeFallback(text, container) {
      
      // Validate input for fallback
      if (!text || typeof text !== 'string' || !text.trim()) {
        showToast('Invalid text for QR generation', 'error');
        return;
      }
      
      try {
        // Check if qrcode-generator library is available
        if (typeof qrcode === 'undefined') {
          showToast('QR generation library not available', 'error');
          return;
        }
        
        // Create a div to hold the QR code
        const qrDiv = document.createElement('div');
        qrDiv.style.textAlign = 'center';
        qrDiv.style.position = 'relative';
        qrDiv.style.display = 'inline-block';
        
        // Generate QR code using qrcode-generator
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        
        // Create table for QR code
        const table = document.createElement('table');
        table.style.border = '0';
        table.style.borderSpacing = '0px';
        table.style.margin = '0 auto';
        
        const qrSize = qr.getModuleCount();
        let cellSize = Math.floor(256 / qrSize);
        
        // Ensure minimum cell size for visibility
        if (cellSize < 2) {
          cellSize = 2;
        }
        
        // Calculate center position for logo
        const centerStart = Math.floor(qrSize / 2) - 2;
        const centerEnd = Math.floor(qrSize / 2) + 2;
        
        for (let row = 0; row < qrSize; row++) {
          const tr = document.createElement('tr');
          for (let col = 0; col < qrSize; col++) {
            const td = document.createElement('td');
            td.style.width = cellSize + 'px';
            td.style.height = cellSize + 'px';
            td.style.padding = '0';
            td.style.margin = '0';
            
            // Check if this cell is in the center area for logo
            const isInCenter = row >= centerStart && row < centerEnd && col >= centerStart && col < centerEnd;
            
            if (isInCenter) {
              // Make center area white for logo
              td.style.backgroundColor = '#FFFFFF';
            } else {
              td.style.backgroundColor = qr.isDark(row, col) ? '#000000' : '#FFFFFF';
            }
            
            tr.appendChild(td);
          }
          table.appendChild(tr);
        }
        
        qrDiv.appendChild(table);
        
        // Add BDT logo in center
        const logoDiv = document.createElement('div');
        logoDiv.style.position = 'absolute';
        logoDiv.style.top = '50%';
        logoDiv.style.left = '50%';
        logoDiv.style.transform = 'translate(-50%, -50%)';
        logoDiv.style.width = (cellSize * 8) + 'px';
        logoDiv.style.height = (cellSize * 8) + 'px';
        logoDiv.style.backgroundColor = '#2563eb';
        logoDiv.style.border = '4px solid #FFFFFF';
        logoDiv.style.borderRadius = '50%';
        logoDiv.style.display = 'flex';
        logoDiv.style.alignItems = 'center';
        logoDiv.style.justifyContent = 'center';
        logoDiv.style.fontWeight = '900';
        logoDiv.style.fontSize = (cellSize * 3) + 'px';
        logoDiv.style.color = '#FFFFFF';
        logoDiv.style.fontFamily = 'Arial, sans-serif';
        logoDiv.style.boxShadow = '0 0 0 2px #000000';
        logoDiv.textContent = 'BDT';
        
        qrDiv.appendChild(logoDiv);
        container.appendChild(qrDiv);
        
        showToast('QR code generated successfully!', 'success');
      } catch (e) {
        showToast('QR code generation failed: ' + e.message, 'error');
      }
    }

    // Generate QR Code
    function generateQRCode(text) {
      
      // Validate input
      if (!text || typeof text !== 'string' || !text.trim()) {
        showToast('Please enter some text to generate QR code', 'error');
        return;
      }
      
      const qrContainer = document.getElementById('qr-code');
      
      if (!qrContainer) {
        showToast('QR container not found', 'error');
        return;
      }
      
      qrContainer.innerHTML = '';
      
      // Check if QRCode library is loaded
      if (typeof QRCode === 'undefined') {
        // Wait for library to load
        setTimeout(() => {
          if (typeof QRCode !== 'undefined') {
            generateQRCode(text);
          } else {
            generateQRCodeFallback(text, qrContainer);
          }
        }, 500);
        return;
      }
      
      
      // Create wrapper div for QR code with logo
      const qrWrapper = document.createElement('div');
      qrWrapper.style.position = 'relative';
      qrWrapper.style.display = 'inline-block';
      qrWrapper.style.textAlign = 'center';
      
      // Create canvas element
      const canvas = document.createElement('canvas');
      qrWrapper.appendChild(canvas);
      qrContainer.appendChild(qrWrapper);
      
      try {
        QRCode.toCanvas(canvas, text, {
          width: 256,
          margin: 2,
          color: {
            dark: '#000000',
            light: '#FFFFFF'
          }
        }, function (error) {
          if (error) {
            qrContainer.innerHTML = '';
            generateQRCodeFallback(text, qrContainer);
          } else {
            
            // Add BDT logo overlay on canvas
            const ctx = canvas.getContext('2d');
            const logoSize = 80;
            const logoX = (canvas.width - logoSize) / 2;
            const logoY = (canvas.height - logoSize) / 2;
            
            // Draw white background circle for logo
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, logoSize / 2 + 8, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw blue circle for logo
            ctx.fillStyle = '#2563eb';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, logoSize / 2, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw black border around white circle
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, logoSize / 2 + 8, 0, 2 * Math.PI);
            ctx.stroke();
            
            // Draw BDT text
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '900 28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('BDT', canvas.width / 2, canvas.height / 2);
            
            showToast('QR code generated successfully!', 'success');
          }
        });
      } catch (e) {
        qrContainer.innerHTML = '';
        generateQRCodeFallback(text, qrContainer);
      }
    }

    // Download QR Code
    function downloadQRCode() {
      // Track download
      if (typeof window.Analytics !== 'undefined') {
        window.Analytics.trackQrDownload({
          page: 'QR Code Generator'
        });
      }
      
      const canvas = document.querySelector('#qr-code canvas');
      const table = document.querySelector('#qr-code table');
      
      if (canvas) {
        // Create a new canvas with watermark
        const downloadCanvas = document.createElement('canvas');
        const ctx = downloadCanvas.getContext('2d');
        downloadCanvas.width = 300; // Slightly larger for watermark
        downloadCanvas.height = 320; // Extra space for watermark
        
        // Fill with white background
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, 300, 320);
        
        // Draw the original QR code
        ctx.drawImage(canvas, 22, 22, 256, 256); // Centered with margin
        
        // Add watermark
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Generated by Bharat Dev Tools', 150, 290);
        ctx.fillText('bharatdevtools.com', 150, 305);
        
        const link = document.createElement('a');
        link.download = `qrcode-${Date.now()}.png`;
        link.href = downloadCanvas.toDataURL();
        link.click();
        showToast('QR code downloaded with watermark', 'success');
      } else if (table) {
        // For table-based QR code, we'll create a canvas and draw the table
        const downloadCanvas = document.createElement('canvas');
        const ctx = downloadCanvas.getContext('2d');
        downloadCanvas.width = 300; // Slightly larger for watermark
        downloadCanvas.height = 320; // Extra space for watermark
        
        // Fill with white background
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, 300, 320);
        
        // Draw the table as QR code
        const rows = table.querySelectorAll('tr');
        const cellSize = 256 / rows.length;
        const startX = 22; // Center the QR code
        const startY = 22;
        
        for (let row = 0; row < rows.length; row++) {
          const cells = rows[row].querySelectorAll('td');
          for (let col = 0; col < cells.length; col++) {
            const cell = cells[col];
            const bgColor = cell.style.backgroundColor;
            if (bgColor === 'rgb(0, 0, 0)' || bgColor === '#000000') {
              ctx.fillStyle = '#000000';
              ctx.fillRect(startX + col * cellSize, startY + row * cellSize, cellSize, cellSize);
            }
          }
        }
        
        // Add BDT logo in center (if not already there)
        const logoSize = 80;
        const centerX = startX + 128;
        const centerY = startY + 128;
        
        // Draw white background circle for logo
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(centerX, centerY, logoSize / 2 + 8, 0, 2 * Math.PI);
        ctx.fill();
        
        // Draw blue circle for logo
        ctx.fillStyle = '#2563eb';
        ctx.beginPath();
        ctx.arc(centerX, centerY, logoSize / 2, 0, 2 * Math.PI);
        ctx.fill();
        
        // Draw black border around white circle
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(centerX, centerY, logoSize / 2 + 8, 0, 2 * Math.PI);
        ctx.stroke();
        
        // Draw BDT text
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 28px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('BDT', centerX, centerY);
        
        // Add watermark
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Generated by Bharat Dev Tools', 150, 290);
        ctx.fillText('bharatdevtools.com', 150, 305);
        
        const link = document.createElement('a');
        link.download = `qrcode-${Date.now()}.png`;
        link.href = downloadCanvas.toDataURL();
        link.click();
        showToast('QR code downloaded with watermark', 'success');
      } else {
        showToast('No QR code to download', 'error');
      }
    }

    // Copy QR URL
    function copyQRURL() {
      // Track copy URL
      if (typeof window.Analytics !== 'undefined') {
        window.Analytics.trackQrCopyUrl({
          page: 'QR Code Generator'
        });
      }
      
      const input = document.getElementById('qr-input');
      const text = input.value.trim();
      if (text) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('URL copied to clipboard', 'success');
        }).catch(() => {
          // Fallback for older browsers
          const textArea = document.createElement('textarea');
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          showToast('URL copied to clipboard', 'success');
        });
      }
    }

    // History management
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('qr-history') || '[]');
      return history;
    }

    function saveToHistory(text) {
      const history = loadHistory();
      const timestamp = new Date().toISOString();
      
      // Avoid duplicates
      if (!history.some(item => item.text === text)) {
        history.unshift({ text, timestamp });
        // Keep only last 10 items
        if (history.length > 10) {
          history.splice(10);
        }
        localStorage.setItem('qr-history', JSON.stringify(history));
        updateHistoryDisplay();
        showToast('QR code saved to history', 'success');
      }
    }

    function updateHistoryDisplay() {
      const history = loadHistory();
      const container = document.getElementById('history-list');
      const count = document.getElementById('history-count');
      const empty = document.getElementById('empty-history');
      
      if (count) {
        count.textContent = `${history.length} QR code${history.length !== 1 ? 's' : ''} saved`;
      }
      
      if (history.length === 0) {
        if (empty) {
          empty.style.display = 'block';
        }
        if (container) {
          container.innerHTML = '';
        }
        return;
      }
      
      if (empty) {
        empty.style.display = 'none';
      }
      if (container) {
        container.innerHTML = history.map((item, index) => {
          const itemDate = new Date(item.timestamp);
          const now = new Date();
          const diffInHours = (now - itemDate) / (1000 * 60 * 60);
          
          let timeDisplay;
          if (diffInHours < 24) {
            timeDisplay = itemDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          } else {
            timeDisplay = itemDate.toLocaleDateString([], { month: 'short', day: 'numeric' });
          }
          
          return `
        <div class="p-4 bg-gray-50 dark:bg-gray-700 rounded-lg animate-slide-up">
          <div class="mb-3">
            <div class="text-sm font-medium text-gray-900 dark:text-white break-all leading-relaxed">${item.text}</div>
          </div>
          <div class="flex items-center justify-between">
            <div class="text-xs text-gray-500 dark:text-gray-400">${timeDisplay}</div>
            <div class="flex items-center space-x-2">
              <button onclick="regenerateQR('${item.text.replace(/'/g, "\\'")}')" class="p-2 text-blue-600 hover:bg-blue-100 dark:hover:bg-blue-900 rounded" title="Regenerate">
                🔄
              </button>
              <button onclick="copyQRText('${item.text.replace(/'/g, "\\'")}')" class="p-2 text-green-600 hover:bg-green-100 dark:hover:bg-green-900 rounded" title="Copy">
                📋
              </button>
              <button onclick="deleteQR(${index})" class="p-2 text-red-600 hover:bg-red-100 dark:hover:bg-red-900 rounded" title="Delete">
                🗑️
              </button>
            </div>
          </div>
        </div>
      `;
        }).join('');
      }
    }

    function regenerateQR(text) {
      // Track edit/regenerate
      if (typeof window.Analytics !== 'undefined') {
        window.Analytics.trackQrHistoryEdit({
          page: 'QR Code Generator'
        });
      }
      document.getElementById('qr-input').value = text;
      generateQRCode(text);
      document.getElementById('qr-container').classList.remove('hidden');
      showToast('QR code regenerated', 'info');
    }

    function copyQRText(text) {
      // Track copy
      if (typeof window.Analytics !== 'undefined') {
        window.Analytics.trackQrHistoryCopy({
          page: 'QR Code Generator'
        });
      }
      navigator.clipboard.writeText(text).then(() => {
        showToast('Text copied to clipboard', 'success');
      }).catch(() => {
        // Fallback for older browsers
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showToast('Text copied to clipboard', 'success');
      });
    }

    function deleteQR(index) {
      // Track delete
      if (typeof window.Analytics !== 'undefined') {
        window.Analytics.trackQrHistoryDelete({
          page: 'QR Code Generator'
        });
      }
      const history = loadHistory();
      history.splice(index, 1);
      localStorage.setItem('qr-history', JSON.stringify(history));
      updateHistoryDisplay();
      showToast('QR code deleted', 'info');
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', function() {
      initTheme();
      updateHistoryDisplay();
      
      // Check for URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const textParam = urlParams.get('text');
      if (textParam) {
        const input = document.getElementById('qr-input');
        const decodedText = decodeURIComponent(textParam);
        input.value = decodedText;
        input.focus();
        showToast('Text loaded from URL', 'info');
      }
      
      const input = document.getElementById('qr-input');
      const generateBtn = document.getElementById('generate-btn');
      const clearBtn = document.getElementById('clear-input');
      const downloadBtn = document.getElementById('download-qr');
      const copyBtn = document.getElementById('copy-qr-url');
      const qrContainer = document.getElementById('qr-container');

      // Theme toggle
      document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

      // Generate QR Code
      generateBtn.addEventListener('click', function() {
        const text = input.value.trim();
        
        if (text) {
          // Track generate button
          if (typeof window.Analytics !== 'undefined') {
            window.Analytics.trackQrGenerateButton({
              page: 'QR Code Generator',
              text_length: text.length
            });
          }
          generateQRCode(text);
          qrContainer.classList.remove('hidden');
          saveToHistory(text);
        } else {
          showToast('Please enter some text or URL', 'error');
        }
      });

      // Clear input
      clearBtn.addEventListener('click', function() {
        input.value = '';
        qrContainer.classList.add('hidden');
        input.focus();
      });

      // Download QR Code
      downloadBtn.addEventListener('click', downloadQRCode);

      // Copy QR URL
      copyBtn.addEventListener('click', copyQRURL);

      // Enter key to generate
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          generateBtn.click();
        }
      });
    });

    // Make functions globally available
    window.regenerateQR = regenerateQR;
    window.copyQRText = copyQRText;
    window.deleteQR = deleteQR;
  </script>
</body>
</html>
